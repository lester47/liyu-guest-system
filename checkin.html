<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a3a85">
<title>來賓報到｜鯉魚國小</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%232a3a85'/%3E%3Cpath d='M8 21c5-7 14-9 21-4l5-4-1 7 1 7-5-4c-7 5-16 3-21-2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="in" style="padding-block:16px">
    <div class="brand">
      <div class="brand-l">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-opacity=".5"/><path d="M8 21c5-7 14-9 21-4l5-4-1 7 1 7-5-4c-7 5-16 3-21-2z" fill="currentColor"/><circle cx="13.5" cy="19.5" r="1.4" fill="var(--pond)"/></svg>
        <div><h1 id="schoolName">南投縣鯉魚國小</h1><p class="sub" id="eventSub">來賓報到</p></div>
      </div>
    </div>
  </div>
</header>

<main class="ck">
  <p class="welcome" id="welcome">歡迎蒞臨，請填寫報到資料</p>

  <form class="panel" id="form" novalidate>
    <div class="field">
      <label for="f-title">頭銜</label>
      <input type="text" id="f-title" maxlength="60" placeholder="例：前山國小 校長" autocomplete="organization-title">
      <span class="hint">單位加職稱，司儀會照這樣介紹</span>
    </div>
    <div class="field">
      <label for="f-name">姓名 <span style="color:var(--koi)">*</span></label>
      <input type="text" id="f-name" maxlength="20" placeholder="例：陳志明" autocomplete="name">
    </div>
    <div class="field"><span class="lbl">身分</span><div class="chips" id="f-cat" role="radiogroup" aria-label="身分"></div></div>
    <div class="err" id="err" hidden></div>
    <button class="btn koi big" type="submit" id="submitBtn">送出報到</button>
  </form>

  <div class="done-box" id="done" hidden>
    <div class="mark" aria-hidden="true">✓</div>
    <h2 id="doneName">報到完成</h2>
    <p>接待人員確認後會通知司儀與校長，歡迎您蒞臨。</p>
    <button class="btn ghost" type="button" id="again">幫下一位填寫</button>
  </div>
  <p class="hint" style="text-align:center">報到資料只用於本次活動介紹來賓，活動結束後由學校封存備查。</p>
</main>
<script type="module" src="js/checkin.js"></script>
</body>
</html>
